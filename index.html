<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sixtyfour&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <section class="site-header">
            <a href="index.html" class="logo">
               <img src="snake-logo.svg" alt="snake game logo">
            </a>
        </section>
    </header>

    <main>
        
            <section class="title-page page-setup">
                <h1>SNAKE GAME</h1>
                <button class="start-btn">START GAME</button>
        
            </section>

            <section class="level-page page-setup">
                <h1>CHOOSE DIFFICULTY</h1>
                <div class="level-btn">
                    <button id="btn-easy">EASY</button>
                    <button id="btn-medium">MEDIUM</button>
                    <button id="hard">HARD</button>
                </div>
            </section>

            <section class="game-page page-setup">
                <h1>SNAKE GAME</h1>
                <section class="scoreboard">
                    <h2>HIGH SCORE: </h2>
                    <h2>SCORE: </h2>
                </section>

                <div class="gameboard">

                </div>

                <section class="game-setting">
                    <button>QUIT</button>
                    <button>RESTART</button>
                </section>

            </section>

    </main>
    
</body>
</html>
